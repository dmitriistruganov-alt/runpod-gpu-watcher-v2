name: RunPod GPU Watcher

on:
  # ОТКЛЮЧЕНО: мониторинг переехал на постоянный воркер Railway (worker.py).
  # Старый cron давал задержки и дублировал уведомления. Оставлен только ручной запуск.
  workflow_dispatch:          # ручной запуск (если понадобится)

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          TG_TOKEN:    ${{ secrets.TG_TOKEN }}
          TG_CHAT:     ${{ secrets.TG_CHAT }}
          RUNPOD_KEY:  ${{ secrets.RUNPOD_KEY }}
          POD_ID:      ${{ secrets.POD_ID }}
          AUTO_RESUME: ${{ secrets.AUTO_RESUME }}
        run: python monitor.py

      - name: Save state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "state update"
          file_pattern: state.json
