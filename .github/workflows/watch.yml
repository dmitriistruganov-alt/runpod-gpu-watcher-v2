name: RunPod GPU Watcher

on:
  schedule:
    - cron: '*/5 * * * *'   # backup: каждые 5 мин на случай обрыва цепи
  workflow_dispatch:

concurrency:
  group: runpod-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          TG_TOKEN:    ${{ secrets.TG_TOKEN }}
          TG_CHAT:     ${{ secrets.TG_CHAT }}
          RUNPOD_KEY:  ${{ secrets.RUNPOD_KEY }}
          POD_ID:      ${{ secrets.POD_ID }}
          AUTO_RESUME: ${{ secrets.AUTO_RESUME }}
        run: python monitor.py

      - name: Save state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "state update"
          file_pattern: state.json

      - name: Queue next run in ~55s
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
        run: |
          sleep 55
          gh workflow run watch.yml --repo ${{ github.repository }} || true
